name: Build
on:
  push:
    branches: [main]
  repository_dispatch:
    types:
      - update-submodule
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: outsideworx
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'outsideworx',
              repo: 'sites',
              event_type: 'build-sites',
              client_payload: { name: 'outsideworx' }
            })
  update-submodule:
    if: github.event_name == 'repository_dispatch'
    runs-on: outsideworx
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.DISPATCH_TOKEN }}
      - env:
          NAME: ${{ github.event.client_payload.name }}
        run: |
          git config user.name "outsideworx"
          git config user.email "info@outsideworx.net"
          git submodule update --remote "clients/${NAME}"
          if git diff --quiet "clients/${NAME}"; then
            echo "No submodule change for ${NAME}; nothing to deploy."
            exit 0
          fi
          git add "clients/${NAME}"
          git commit -m "Update ${NAME} submodule"
          git push
